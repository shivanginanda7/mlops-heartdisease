# Generated from monitoring/source/prometheus.yml
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: "global:\n  scrape_interval: 5s\n  evaluation_interval: 15s\n\nscrape_configs:\n  # Finds every pod in heart-risk that carries the prometheus.io/* annotations\n  # from k8s/10-deployment.yaml, so new or replaced pods are picked up automatically.\n  - job_name: heart-api\n    kubernetes_sd_configs:\n      - role: pod\n        namespaces:\n          names: [heart-risk]\n    relabel_configs:\n      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]\n        action: keep\n        regex: \"true\"\n      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]\n        action: replace\n        regex: (.+)\n        target_label: __metrics_path__\n      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]\n        action: replace\n        regex: ([^:]+)(?::\\d+)?;(\\d+)\n        replacement: $1:$2\n        target_label: __address__\n      - source_labels: [__meta_kubernetes_pod_name]\n        target_label: pod\n"
