global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  # Finds every pod in heart-risk that carries the prometheus.io/* annotations
  # from k8s/10-deployment.yaml, so new or replaced pods are picked up automatically.
  - job_name: heart-api
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [heart-risk]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        regex: (.+)
        target_label: __metrics_path__
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
