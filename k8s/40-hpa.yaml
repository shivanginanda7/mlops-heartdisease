# Scale between 2 and 5 pods to keep average CPU around 70% of the request
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: heart-api
  namespace: heart-risk
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: heart-api
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
