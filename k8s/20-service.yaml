# Stable internal address for the pods; the Ingress routes outside traffic here
apiVersion: v1
kind: Service
metadata:
  name: heart-api
  namespace: heart-risk
  labels:
    app.kubernetes.io/name: heart-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: heart-api
  ports:
    - name: http
      port: 80
      targetPort: http
