apiVersion: apps/v1
kind: Deployment
metadata:
  name: heart-api
  namespace: heart-risk
  labels:
    app.kubernetes.io/name: heart-api
    app.kubernetes.io/version: "1.0"
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: heart-api
  # Zero-downtime updates: start a new pod before an old one is removed
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: heart-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: heart-api:1.0
          # The image is loaded straight into Minikube, never pulled from a registry
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: MODEL_DIR
              value: /app/models
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Give the model time to load before the other probes start
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 3
            failureThreshold: 20
          # Only send traffic once the model is loaded
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 2
          # Restart the container if the process stops responding
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
